name: Lineup watchdog

# Pulls the lineup-runner Worker's /runs, /status and /alerts and pushes problems to Pushover, urgent ones falling back to ntfy if Pushover rejects them (src/watchdog/lineup-watchdog.ts)
# Logs are public: the script prints counts only, and URL and tokens come from secrets. The cached state holds alert ids and times only
on:
  # GitHub starts schedules late, often 5-20 min, and more so on the hour
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: Send one test push instead of checking the Worker
        type: boolean
        default: false

permissions:
  contents: read

concurrency: lineup-watchdog

env:
  WATCHDOG_STATE_FILE: lineup-watchdog-state.json

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src/watchdog
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # A cache key can't be overwritten, so each run saves a new one and the next restores the newest by prefix
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WATCHDOG_STATE_FILE }}
          key: lineup-watchdog-state-${{ github.run_id }}
          restore-keys: lineup-watchdog-state-
      - name: Check the Worker and push problems
        env:
          LINEUP_RUNNER_URL: ${{ secrets.LINEUP_RUNNER_URL }}
          LINEUP_RUNNER_TOKEN: ${{ secrets.LINEUP_RUNNER_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bun src/watchdog/lineup-watchdog.ts ${{ inputs.test && '--test' || '' }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && hashFiles(env.WATCHDOG_STATE_FILE) != ''
        with:
          path: ${{ env.WATCHDOG_STATE_FILE }}
          key: lineup-watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}
